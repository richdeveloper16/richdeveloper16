
name: 🐍 Cyberpunk Contribution Snake

on:
  workflow_dispatch:

  schedule:
    # Todos los días a las 06:00 UTC
    - cron: "0 6 * * *"

  push:
    branches:
      - main
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate-snake:
    name: Generate Cyberpunk Snake
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate Cyberpunk SVG animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: richdeveloper16
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2322D3EE&color_dots=%23F3E8FF,%23DDD6FE,%23C084FC,%239333EA,%23EC4899
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2322D3EE&color_dots=%2309090B,%233B1B59,%237E22CE,%23A855F7,%23EC4899

      - name: Publish SVG animations
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
